<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The dashboard factory: the flow</title>
<style>
  :root { --bg:#0b0b0c; --node:#151618; --edge:#2a2b2f; --line:#3b3c41; --text:#d7d8db; --sub:#85878c; --label:#6d6f74;
    --de:#5b9cff; --biz:#3ddc97; --bi:#b18cff; --file:#9a9ca2; --run:#4fd1e6; --fin:#f2b84b; --sec:#ff6b6b; }
  @page { size: 1500px 2560px; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .world { position:relative; width:1500px; height:2560px; margin:0 auto; }
  svg.wires { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .title { position:absolute; left:60px; top:26px; max-width:700px; line-height:1.6; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); }
  .title b { color:var(--text); font-weight:600; }
  .node { position:absolute; background:var(--node); border:1px solid var(--edge); border-radius:9px; padding:14px 18px 14px 16px; white-space:nowrap;
    display:flex; align-items:flex-start; gap:12px; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
  .node .ic { width:16px; height:16px; flex:none; margin-top:1px; color:var(--sub); }
  .node .t { font-size:13px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  .node .s { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin-top:5px; }
  .tag { position:absolute; top:-9px; left:12px; font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:2px 7px; border-radius:4px;
    background:var(--bg); border:1px solid var(--edge); }
  .node[data-cat=de] .tag { color:var(--de); border-color:rgba(91,156,255,.45); }
  .node[data-cat=biz] .tag { color:var(--biz); border-color:rgba(61,220,151,.45); }
  .node[data-cat=bi] .tag { color:var(--bi); border-color:rgba(177,140,255,.45); }
  .node[data-cat=file] .tag { color:var(--file); border-color:rgba(154,156,162,.45); }
  .node[data-cat=run] .tag { color:var(--run); border-color:rgba(79,209,230,.45); }
  .node[data-cat=fin] .tag { color:var(--fin); border-color:rgba(242,184,75,.45); }
  .node[data-cat=sec] .tag { color:var(--sec); border-color:rgba(255,107,107,.45); }
  .node[data-cat=de] .ic { color:var(--de); } .node[data-cat=biz] .ic { color:var(--biz); } .node[data-cat=bi] .ic { color:var(--bi); }
  .node[data-cat=run] .ic { color:var(--run); } .node[data-cat=fin] .ic { color:var(--fin); } .node[data-cat=sec] .ic { color:var(--sec); }
  .group { position:absolute; border:1px dashed #26272b; border-radius:12px; }
  .group .gl { position:absolute; left:18px; top:-8px; padding:0 8px; background:var(--bg); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--label); }
  .legend { position:absolute; right:60px; top:58px; display:flex; gap:18px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .lbl { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; fill:var(--label); }
</style>
</head>
<body>
<div class="world" id="world">
  <svg class="wires" id="wires">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b4d53"/></marker>
      <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6167"/></marker>
    </defs>
  </svg>
  <div class="title"><b>The dashboard factory</b> &nbsp;·&nbsp; only two things run: Oracle runs SQL, React shows charts. Everything between is a file in git.</div>
  <div class="legend">
    <span><i style="background:var(--de)"></i>Data engineers</span><span><i style="background:var(--biz)"></i>Business</span><span><i style="background:var(--bi)"></i>Eng. team + skill</span>
    <span><i style="background:var(--file)"></i>File in git</span><span><i style="background:var(--fin)"></i>Finance</span><span><i style="background:var(--sec)"></i>Security</span><span><i style="background:var(--run)"></i>Runs in production</span>
  </div>
</div>
<script>
const ICONS = {
  doc: '<path d="M4 2h6l4 4v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M10 2v4h4"/>',
  table: '<rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 7h12M6 3v10"/>',
  db: '<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4"/><path d="M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  user: '<circle cx="8" cy="5" r="2.6"/><path d="M2.5 14c.6-3 2.7-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/>',
  slash: '<path d="M6 14 10 2"/>',
  term: '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6l2.5 2-2.5 2M8.5 10h3"/>',
  check: '<path d="M3 8.5 6.5 12 13 4.5"/>',
  shield: '<path d="M8 1.5 13.5 3.5v4.5c0 3-2.3 5.3-5.5 6.5C4.8 13.3 2.5 11 2.5 8V3.5z"/>',
  key: '<circle cx="5.5" cy="10.5" r="3"/><path d="M8 8.5 14 2.5M11 5.5l2 2M9.5 7l1.5 1.5"/>',
  layout: '<rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M2 6.5h12M7 6.5v7"/>',
  cursor: '<path d="M3 2l4.5 11 1.6-4.2L13 7.2z"/>',
  recipe: '<path d="M3 13V6M8 13V3M13 13V8"/>',
  flag: '<path d="M4 14V2h8l-2 3 2 3H4"/>',
  git: '<circle cx="4" cy="4" r="1.8"/><circle cx="4" cy="12" r="1.8"/><circle cx="12" cy="6" r="1.8"/><path d="M4 5.8v4.4M12 7.8c0 2.5-3 2-8 3"/>',
  hand: '<path d="M6 8V3.5a1 1 0 0 1 2 0V8m0-2.5a1 1 0 0 1 2 0V8m0-1.5a1 1 0 0 1 2 0V10c0 2.5-2 4-4.5 4S4 12.5 4 10V7a1 1 0 0 1 2 0"/>',
  play: '<path d="M4 2.5v11l9-5.5z"/>',
};
const N = {};
const world = document.getElementById('world'), wires = document.getElementById('wires');
function node(o) {
  const el = document.createElement('div');
  el.className = 'node'; el.dataset.cat = o.cat; el.id = o.id;
  el.innerHTML = `<span class="tag">${o.tag}</span><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONS[o.icon]}</svg><div><div class="t">${o.t}</div>${o.s ? `<div class="s">${o.s}</div>` : ''}</div>`;
  world.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const x = o.cx !== undefined ? o.cx - w / 2 : o.x;
  el.style.left = x + 'px'; el.style.top = o.y + 'px';
  N[o.id] = { x, y: o.y, w, h, l: [x, o.y + h / 2], r: [x + w, o.y + h / 2], t: [x + w / 2, o.y], b: [x + w / 2, o.y + h] };
}
function group(x, y, w, h, label) {
  const g = document.createElement('div'); g.className = 'group'; g.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  g.innerHTML = `<span class="gl">${label}</span>`; world.appendChild(g);
}
const R = 14;
function path(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const d1 = Math.hypot(cx - px, cy - py), d2 = Math.hypot(nx - cx, ny - cy), r = Math.min(R, d1 / 2, d2 / 2);
    const ux = (cx - px) / d1, uy = (cy - py) / d1, vx = (nx - cx) / d2, vy = (ny - cy) / d2;
    d += ` L${cx - ux * r} ${cy - uy * r} Q${cx} ${cy} ${cx + vx * r} ${cy + vy * r}`;
  }
  const [lx, ly] = pts[pts.length - 1];
  return d + ` L${lx} ${ly}`;
}
const svgNS = 'http://www.w3.org/2000/svg';
function wire(pts, o = {}) {
  const p = document.createElementNS(svgNS, 'path');
  p.setAttribute('d', path(pts)); p.setAttribute('fill', 'none');
  p.setAttribute('stroke', o.dash ? '#4a4c52' : '#3b3c41'); p.setAttribute('stroke-width', '1.3');
  if (o.dash) p.setAttribute('stroke-dasharray', '5 5');
  if (!o.noArrow) p.setAttribute('marker-end', `url(#${o.dash ? 'd' : 'a'})`);
  wires.appendChild(p);
  if (o.label) {
    const [lx, ly] = o.at;
    const t = document.createElementNS(svgNS, 'text'); t.setAttribute('class', 'lbl'); t.setAttribute('x', lx); t.setAttribute('y', ly + 4); t.setAttribute('text-anchor', o.anchor || 'middle');
    t.textContent = o.label; wires.appendChild(t);
    const bb = t.getBBox(); const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x', bb.x - 6); bg.setAttribute('y', bb.y - 2); bg.setAttribute('width', bb.width + 12); bg.setAttribute('height', bb.height + 4); bg.setAttribute('fill', '#0b0b0c');
    wires.insertBefore(bg, t);
  }
}
const down = (a, b, gap = 0) => wire([[N[a].b[0], N[a].b[1] + 1], [N[b].t[0], N[b].t[1] - 1]]);

const CX = 620, RX = 1290, LX = 190;
// ---- the spine ----
node({ id: 'exp', cat: 'de', tag: 'Data engineers', icon: 'doc', cx: CX, y: 90, t: 'Schema export', s: 'Excel or CSV · tables, columns, keys, joins as text' });
node({ id: 'imp', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 200, t: '/import-schema', s: 'parser writes the files · validator checks them' });
node({ id: 'src', cat: 'file', tag: 'File in git', icon: 'db', cx: CX, y: 310, t: 'sources/&lt;TABLE&gt;.yaml', s: 'one per table · key declared · joins as stated' });
node({ id: 'form', cat: 'biz', tag: 'Business', icon: 'doc', cx: CX, y: 440, t: 'Request form', s: 'Word or Markdown · numbers, filters, access' });
node({ id: 'bc', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 550, t: '/business-context', s: 'sorts their sentences · checker proves verbatim' });
node({ id: 'ctx', cat: 'file', tag: 'File in git', icon: 'doc', cx: CX, y: 660, t: 'business-context.md', s: 'numbers table · ? cells · section 8 questions' });
node({ id: 'draft', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 790, t: '/build-model draft', s: 'clean tables · DRAFT recipes · proofs · lint runs last' });
node({ id: 'views', cat: 'file', tag: 'File in git', icon: 'table', cx: 300, y: 905, t: 'bi_model/&lt;view&gt;.sql', s: 'clean tables · joins once' });
node({ id: 'reg', cat: 'file', tag: 'File in git', icon: 'recipe', cx: CX, y: 905, t: 'catalog/kpi-registry.yaml', s: 'recipes · one view, one sentence' });
node({ id: 'psql', cat: 'file', tag: 'File in git', icon: 'doc', cx: 950, y: 905, t: 'bi_model/proofs/&lt;view&gt;.sql', s: 'grain · fan-out · conservation' });
node({ id: 'run', cat: 'de', tag: 'Data engineers', icon: 'play', cx: RX, y: 1015, t: 'Run the proofs', s: 'read-only on the replica · days may pass' });
node({ id: 'pmd', cat: 'file', tag: 'File in git', icon: 'check', cx: RX, y: 1130, t: 'bi_model/proofs/&lt;view&gt;.md', s: 'the counts, pasted beside the query' });
node({ id: 'fin', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 1130, t: '/build-model finalize · /rls', s: 'judges the counts · checklists · policy · opens the PR' });
node({ id: 'pr', cat: 'file', tag: 'File in git', icon: 'git', cx: CX, y: 1250, t: 'Pull request', s: 'views · recipes · proofs · policies · lint green' });
node({ id: 'pol', cat: 'sec', tag: 'Security', icon: 'shield', cx: RX, y: 1250, t: 'security/rls-policies.yaml', s: 'which column per role · 1 declared' });
node({ id: 'conf', cat: 'biz', tag: 'Business', icon: 'check', cx: CX, y: 1370, t: 'Confirms each recipe', s: 'Catalog page on the PR · merge when all CONFIRMED' });
node({ id: 'dep', cat: 'de', tag: 'Data engineers', icon: 'db', cx: CX, y: 1490, t: 'Pipeline deploys the views', s: 'into Oracle schema BI_MODEL' });
node({ id: 'dict', cat: 'file', tag: 'File in git', icon: 'doc', cx: RX, y: 1490, t: 'catalog/data-dictionary.yaml', s: 'via /data-dictionary in CI · what is live' });
node({ id: 'des', cat: 'bi', tag: 'Eng. team', icon: 'layout', cx: CX, y: 1610, t: 'Design the page', s: 'Open Design from the Catalog · exported to git' });
node({ id: 'spec', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 1720, t: '/spec', s: 'binds every chart to a recipe · READY or BLOCKED' });
node({ id: 'specf', cat: 'file', tag: 'File in git', icon: 'flag', cx: CX, y: 1830, t: 'dashboards/&lt;name&gt;/spec.yaml', s: 'layout only · no formula, column or view name' });
node({ id: 'build', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 1950, t: '/build', s: 'React page · queries.sql · RLS proven with test users' });
node({ id: 'ver', cat: 'bi', tag: 'Eng. team + skill', icon: 'term', cx: CX, y: 2060, t: '/verify in CI', s: 'every number against finance · 4 tested' });
node({ id: 'acc', cat: 'fin', tag: 'Finance', icon: 'recipe', cx: RX, y: 2060, t: 'catalog/acceptance.yaml', s: "finance's number per recipe" });
node({ id: 'live', cat: 'run', tag: 'Live', icon: 'cursor', cx: CX, y: 2180, t: 'Live dashboard' });
// ---- runtime band ----
group(60, 2300, 1380, 210, 'At runtime, every query · what happens each time someone opens the dashboard');
node({ id: 'viewer', cat: 'run', tag: 'Person', icon: 'hand', x: 100, y: 2345, t: 'A viewer' });
node({ id: 'react', cat: 'run', tag: 'Runs in production', icon: 'layout', x: 330, y: 2345, t: 'React dashboard' });
node({ id: 'sq', cat: 'run', tag: 'Runs in production', icon: 'key', x: 620, y: 2335, t: 'semantic-query', s: 'recipe + user → SQL · adds AND col IN (:allowed) · 3 enforced' });
node({ id: 'ora', cat: 'run', tag: 'Read-only', icon: 'db', x: 1120, y: 2345, t: 'Oracle · BI_MODEL views' });
node({ id: 'ent', cat: 'sec', tag: 'Security', icon: 'shield', x: 620, y: 2425, t: 'BI_SECURITY.ENTITLEMENTS', s: 'who sees which values · 2 entitled · via the Admin tab' });

// ---- straight handovers ----
down('exp', 'imp'); down('imp', 'src'); down('src', 'form'); down('form', 'bc'); down('bc', 'ctx'); down('ctx', 'draft');
wire([[N.draft.b[0], N.draft.b[1] + 1], [N.draft.b[0], 870], [N.views.t[0], 870], [N.views.t[0], N.views.t[1] - 1]]);
down('draft', 'reg');
wire([[N.draft.b[0], N.draft.b[1] + 1], [N.draft.b[0], 870], [N.psql.t[0], 870], [N.psql.t[0], N.psql.t[1] - 1]]);
wire([[N.reg.b[0], N.reg.b[1] + 1], [N.fin.t[0], N.fin.t[1] - 1]]);
wire([[N.views.b[0], N.views.b[1] + 1], [N.views.b[0], 1100], [N.fin.l[0] - 1, 1100]], { noArrow: true });
down('fin', 'pr'); down('pr', 'conf'); down('conf', 'dep'); down('dep', 'des'); down('des', 'spec'); down('spec', 'specf'); down('specf', 'build'); down('build', 'ver'); down('ver', 'live');
wire([[N.viewer.r[0] + 1, N.viewer.r[1]], [N.react.l[0] - 1, N.react.l[1]]]);
wire([[N.react.r[0] + 1, N.react.r[1]], [N.sq.l[0] - 1, N.sq.l[1]]]);
wire([[N.sq.r[0] + 1, N.sq.r[1]], [N.ora.l[0] - 1, N.ora.l[1]]]);
wire([[N.ent.t[0], N.ent.t[1] - 1], [N.sq.b[0], N.sq.b[1] + 1]]);

// ---- the proof loop (right) ----
wire([[N.psql.r[0] + 1, N.psql.r[1]], [RX, N.psql.r[1]], [RX, N.run.t[1] - 1]], { label: 'proof queries, by email or PR', at: [RX - 12, 985], anchor: 'end' });
down('run', 'pmd');
wire([[N.pmd.l[0] - 1, N.pmd.l[1]], [N.fin.r[0] + 1, N.fin.r[1]]], { label: 'the counts', at: [(N.pmd.l[0] + N.fin.r[0]) / 2, N.pmd.l[1] - 14] });
// failed check: back to draft (left, dashed)
wire([[N.fin.l[0] - 1, N.fin.l[1]], [LX, N.fin.l[1]], [LX, N.draft.l[1]], [N.draft.l[0] - 1, N.draft.l[1]]], { dash: true, label: 'a failed proof sends that view back to draft', at: [LX + 10, 1000], anchor: 'start' });

// ---- the two question loops (right, dashed) ----
node({ id: 'deq', cat: 'de', tag: 'Data engineers', icon: 'user', cx: RX, y: 200, t: 'Answer the report', s: 'a corrected export · a new dated handover' });
wire([[N.imp.r[0] + 1, N.imp.r[1]], [N.deq.l[0] - 1, N.deq.l[1]]], { dash: true, label: 'questions for the data team', at: [(N.imp.r[0] + N.deq.l[0]) / 2, N.imp.r[1] - 14] });
wire([[N.deq.t[0], N.deq.t[1] - 1], [N.deq.t[0], N.exp.r[1]], [N.exp.r[0] + 1, N.exp.r[1]]], { dash: true, label: 'run it again on the new file', at: [N.deq.t[0] - 14, 152], anchor: 'end' });
node({ id: 'bzq', cat: 'biz', tag: 'Business', icon: 'user', cx: RX, y: 550, t: 'Answer section 8', s: 'saved as notes-&lt;date&gt;.md · their words' });
wire([[N.ctx.r[0] + 1, N.ctx.r[1]], [RX, N.ctx.r[1]], [RX, N.bzq.b[1] + 1]], { dash: true, label: 'section 8 questions · ? cells', at: [(N.ctx.r[0] + RX) / 2, N.ctx.r[1] - 14] });
wire([[N.bzq.l[0] - 1, N.bzq.l[1]], [N.bc.r[0] + 1, N.bc.r[1]]], { dash: true, label: 'run it again with form + notes', at: [(N.bzq.l[0] + N.bc.r[0]) / 2, N.bc.r[1] - 14] });

// ---- side inputs ----
wire([[N.pol.l[0] - 1, N.pol.l[1]], [N.pr.r[0] + 1, N.pr.r[1]]], { label: 'one entry per view', at: [(N.pol.l[0] + N.pr.r[0]) / 2, N.pr.r[1] - 14] });
wire([[N.pol.b[0], N.pol.b[1] + 1], [N.pol.b[0], 2200], [1330, 2200], [1330, N.ora.t[1] - 1]], { dash: true, label: 'which column, per role', at: [1318, 2250], anchor: 'end' });
wire([[N.dep.r[0] + 1, N.dep.r[1]], [N.dict.l[0] - 1, N.dict.l[1]]], { label: 'CI reads the live schema', at: [(N.dep.r[0] + N.dict.l[0]) / 2, N.dep.r[1] - 14] });
wire([[N.acc.l[0] - 1, N.acc.l[1]], [N.ver.r[0] + 1, N.ver.r[1]]], { label: 'one row per recipe', at: [N.acc.l[0] - 10, N.ver.r[1] - 14], anchor: 'end' });
// spec BLOCKED loop (left, dashed)
wire([[N.specf.l[0] - 1, N.specf.l[1]], [LX - 60, N.specf.l[1]], [LX - 60, N.draft.l[1] + 18], [N.draft.l[0] - 1, N.draft.l[1] + 18]], { dash: true, label: 'BLOCKED: back to the model', at: [LX - 40, 1420], anchor: 'start' });
wire([[N.dep.r[0] + 1, N.dep.r[1] + 14], [1010, N.dep.r[1] + 14], [1010, N.ora.t[1] - 1]], { dash: true, label: 'the views live here', at: [1000, 2250], anchor: 'end' });
</script>
</body>
</html>
